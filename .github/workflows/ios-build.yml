name: iOS build
on:
  push:
    branches:
      - feature/ios-widget
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/DiarioTemperatura/project.yml
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/DiarioTemperatura/DiarioTemperatura.xcodeproj -scheme DiarioTemperatura
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/DiarioTemperatura/DiarioTemperatura.xcodeproj -scheme DiarioTemperatura -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
