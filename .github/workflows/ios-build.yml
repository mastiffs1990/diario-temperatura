name: iOS build
on:
  push:
    branches:
      - feature/ios-widget
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/DiarioTemperatura
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios/DiarioTemperatura
        run: xcodebuild -resolvePackageDependencies -project DiarioTemperatura.xcodeproj -scheme DiarioTemperatura
      - name: Build for iOS Simulator
        working-directory: ios/DiarioTemperatura
        run: xcodebuild -project DiarioTemperatura.xcodeproj -scheme DiarioTemperatura -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
