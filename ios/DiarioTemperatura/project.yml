name: DiarioTemperatura
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
targets:
  DiarioTemperatura:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - it.diariotemperatura.app.refresh
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: it.diariotemperatura.app
            CFBundleURLSchemes:
              - diariotemperatura
    entitlements:
      path: Sources/App/DiarioTemperatura.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.diariotemperatura.shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: DiarioTemperaturaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.diariotemperatura.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Diario Temperatura"
  DiarioTemperaturaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/DiarioTemperaturaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.it.diariotemperatura.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.diariotemperatura.app.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
