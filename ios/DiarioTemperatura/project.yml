name: DiarioTemperatura
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  DiarioTemperatura:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
    entitlements:
      path: Sources/App/DiarioTemperatura.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
      - target: DiarioTemperaturaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.diariotemperatura.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Diario Temperatura"
  DiarioTemperaturaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
    entitlements:
      path: Sources/Widget/DiarioTemperaturaWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.diariotemperatura.app.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
